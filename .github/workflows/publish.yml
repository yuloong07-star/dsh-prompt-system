name: Publish to npm

# 手动触发：npm 侧的 trusted publisher 尚未配置，随 tag 自动发布会必然失败。
# 配置完成后可恢复 `push: tags: ["v*"]` 触发。
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm publish --provenance --access public
